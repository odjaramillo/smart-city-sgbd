# OpenSpec Configuration — smart-city-sgbd
# Generated by sdd-init (hybrid mode). Do not edit manually unless you know why.
schema: spec-driven

context: |
  Tech stack: PostgreSQL 16, Python 3.11+, Dash 2.14+, SQLAlchemy 2.0+, Docker Compose 3.9
  Architecture: Kimball star schema Data Mart with ELT stored procedures, SCD Type 2 dimensions, BRIN indexes
  Dashboard: Dash + Plotly + dash-bootstrap-components (DARKLY theme), drill-down & heatmap layouts
  Deployment: Supabase (PostgreSQL 15+) for production cloud; Docker Compose for local development
  Testing: pytest for Python (unit + integration); manual SQL smoke test (PL/pgSQL) for ELT pipeline validation
  Style: Python standard; SQL with embedded architecture comments in Spanish

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes to DDL or stored procedures
    - Document impact on smoke test conteos if data generation logic changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - For SQL changes, include schema drift checks against 01-ddl-modelo-estrella.sql
  design:
    - Include sequence diagrams for ELT flows
    - Document architecture decisions with rationale in SQL comments
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate DDL, DML, Python dashboard, and documentation tasks
  apply:
    - Follow existing code patterns (Kimball star schema, SCD Type 2, BRIN indexes)
    - Preserve determinism in seed data generation (fixed seed 42 default)
    tdd: true
    test_command: "pytest"
  verify:
    test_command: "pytest"
    build_command: "docker-compose up -d --build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas to DDL or SPs
    - Preserve smoke test state snapshots and expected conteos

testing:
  capabilities:
    runner:
      available: true
      framework: pytest
      command: "pytest"
      note: Automated Python tests via pytest. Manual SQL smoke test exists in 05-verificacion-smoke-test.sql for ELT validation.
    layers:
      unit:
        available: true
        tool: pytest
      integration:
        available: true
        tool: pytest
        note: pytest for Python integration tests; manual SQL smoke test (PL/pgSQL DO blocks) for ELT pipeline end-to-end.
      e2e:
        available: false
        tool: null
    coverage:
      available: true
      command: "pytest --cov=dashboard --cov-report=term-missing"
    quality:
      linter:
        available: false
        command: null
      type_checker:
        available: false
        command: null
      formatter:
        available: false
        command: null
